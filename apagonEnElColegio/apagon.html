<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Unlock C&A – Apagón en el Colegio</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Poppins", system-ui;
      background: linear-gradient(180deg, #080812 0%, #15162a 60%);
      color: #fff;
      margin: 0;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
    }

    h1 {
      font-size: clamp(28px, 4vw, 46px);
      color: #ff0055;
      margin-bottom: 10px;
    }

    h2 {
      color: rgba(255,255,255,0.8);
      margin-top: 0;
      font-weight: 400;
    }

    .content {
      max-width: 700px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      text-align: center;
    }

    p {
      color: rgba(255,255,255,0.8);
      line-height: 1.6;
    }

    .btn {
      background: linear-gradient(90deg, #ff0055, #ff6ea1);
      color: white;
      font-weight: 700;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      margin-top: 20px;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(255,0,85,0.3);
    }
  </style>
</head>
<body>
  <h1>Unlock C&A</h1>
  <h2>Apagón en el Colegio Santa María de los Apóstoles</h2>

  <div class="content">
    <p>La luz se apaga de golpe. Alberto y Cristina están atrapados en el colegio. Solo tú puedes guiarlos para reactivar el generador y salir antes de que sea demasiado tarde...</p>

    <button class="btn" onclick="volver()">← Volver al menú</button>
  </div>

  <script>
    // Vuelve al menú principal
    function volver() {
      window.location.href = "../index.html";
    }
  </script>
</body>
</html>
