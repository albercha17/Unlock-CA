<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pedidos · Cronoportal</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0a12">
  <link rel="icon" type="image/png" href="../assets/icons/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tienda.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="nav">
  <a class="marca" href="./"><span class="marca-anillo" aria-hidden="true"></span>Cronoportal</a>
  <span class="nav-titulo">Pedidos</span>
  <button class="btn btn-linea btn-sm" id="salir" type="button" hidden>Salir</button>
</header>

<main class="admin">

  <section class="login" id="login" hidden>
    <h1>Panel de pedidos</h1>
    <p class="sub">Entra con tu cuenta de administrador.</p>
    <form id="form-login" novalidate>
      <label>Correo <input name="email" type="email" autocomplete="username" required></label>
      <label>Contraseña <input name="clave" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-oro btn-ancho" type="submit">Entrar</button>
      <button class="enlace" type="button" id="olvido">He olvidado la contraseña</button>
      <p class="error" id="error-login" role="alert"></p>
    </form>
  </section>

  <section id="panel" hidden>
    <div class="barra">
      <div class="filtros" role="tablist" id="filtros"><!-- admin.js --></div>
      <button class="btn btn-linea btn-sm" id="recargar" type="button">Actualizar</button>
    </div>
    <p class="error" id="error-panel" role="alert"></p>
    <div class="lista" id="lista"><!-- admin.js --></div>
  </section>

  <p class="cargando" id="cargando">Cargando…</p>
</main>

<script src="../assets/js/vendor/supabase.js" defer></script>
<script src="admin.js" defer></script>
</body>
</html>
