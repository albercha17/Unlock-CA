<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#071013">
  <title>Mis partidas — Unlock C&amp;A</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="assets/icons/favicon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Unlock C&A">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/menu.css">
  <style>
    :root{--bg:#071013;--panel:#0e1d22;--panel2:#13292f;--line:#21404a;--tx:#e8f1f3;--mut:#8fb0b8;--laton:#d9a441;--laton2:#f0c773;--cian:#3dd6c6}
    *{box-sizing:border-box}
    html,body{margin:0;background:radial-gradient(circle at 50% 0,#10303a 0,var(--bg) 60%);color:var(--tx);font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100%}
    body{padding:max(22px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom))}
    .wrap{max-width:760px;margin:0 auto}
    h1{margin:0 0 4px;font-size:1.8rem;color:var(--laton2)}
    .sub{margin:0 0 16px;color:var(--mut);font-size:.92rem}
    .volver{display:inline-block;margin:0 0 16px;color:var(--mut);text-decoration:none;font-size:.9rem;border:1px solid var(--line);border-radius:10px;padding:8px 14px}
    .aviso{background:#2a1c10;border:1px solid #6a4a22;color:#ffd9a0;border-radius:12px;padding:10px 12px;font-size:.86rem;margin:0 0 14px;line-height:1.45}
    .vacio{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;color:var(--mut);line-height:1.5}
    h2{margin:26px 0 8px;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;color:var(--laton2)}
    .resumen{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
    .tarj{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:12px 14px}
    .tarj h3{margin:0 0 4px;font-size:.98rem}
    .tarj .t{font-size:1.5rem;font-weight:800;color:#9dffb0;font-variant-numeric:tabular-nums}
    .tarj .pend{color:var(--mut)}
    .tarj small{display:block;color:var(--mut);margin-top:2px}
    table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:.88rem}
    th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
    th{color:var(--mut);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
    td.n{font-variant-numeric:tabular-nums}
    tr:last-child td{border-bottom:0}
    .tag{font-size:.68rem;color:#ffd9a0;border:1px solid #6a4a22;border-radius:999px;padding:1px 7px;margin-left:6px}
    .tabla-scroll{overflow-x:auto}
    .logros{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
    .logro{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;opacity:.6}
    .logro.on{opacity:1;border-color:var(--laton);background:linear-gradient(180deg,#2a2210,var(--panel))}
    .logro b{display:block;font-size:.9rem}
    .logro.on b{color:var(--laton2)}
    .logro small{display:block;margin-top:2px;color:var(--mut);font-size:.76rem;line-height:1.35}
  </style>
</head>
<body data-raiz="">
<div class="wrap">
  <a class="volver" href="index.html">← Volver al menú</a>
  <h1>Mis partidas</h1>
  <p class="sub" id="sub">Cuánto has tardado en cada aventura y cuáles has completado.</p>
  <div id="cuenta"></div>
  <div id="aviso"></div>
  <div id="contenido"><div class="vacio">Cargando tus partidas…</div></div>
</div>
<script src="assets/js/pwa.js"></script>
<script type="module">
import { misPartidas, resumenPorJuego, formatoTiempo, alCambiarSesion } from './assets/js/cuenta.js';
import { montarCuenta } from './assets/js/cuenta-ui.js';

montarCuenta(document.getElementById('cuenta'), { perfil: 'perfil.html' });
const NOMBRES = {};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fecha = (iso) => { try { return new Date(iso).toLocaleString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return iso; } };

async function pintar() {
  try { (await (await fetch('juegos/catalogo.json')).json()).forEach((j) => { NOMBRES[j.id] = j; }); } catch (e) { /* sin catálogo */ }
  const r = await misPartidas();
  const cont = document.getElementById('contenido');
  document.getElementById('aviso').innerHTML = r.aviso ? '<div class="aviso">' + esc(r.aviso) + '</div>' : '';
  document.getElementById('sub').textContent = r.usuario ? 'Sesión iniciada como ' + r.usuario.email + '.' : 'Sin sesión: se muestran las partidas guardadas en este dispositivo. Inicia sesión para tenerlas en tu cuenta.';
  if (!r.partidas.length) { cont.innerHTML = '<div class="vacio">Todavía no hay partidas guardadas. Cuando termines una aventura (carta 99), su tiempo aparecerá aquí.</div>'; return; }
  const res = resumenPorJuego(r.partidas);
  const ids = Object.keys(NOMBRES);
  const tarjetas = ids.map((id) => {
    const x = res[id], j = NOMBRES[id];
    return '<div class="tarj"><h3>' + esc(j.nombre.split(':').slice(-1)[0].trim() || j.nombre) + '</h3>' +
      (x ? '<div class="t">' + formatoTiempo(x.mejor) + '</div><small>Mejor tiempo · ' + x.veces + (x.veces === 1 ? ' vez' : ' veces') + '</small>' : '<div class="t pend">—</div><small>Sin completar · ' + j.minutos + ' min</small>') + '</div>';
  }).join('');
  const filas = r.partidas.map((p) => {
    const j = NOMBRES[p.juego];
    return '<tr><td>' + esc(j ? j.nombre.split(':').slice(-1)[0].trim() : p.juego) + '</td><td class="n">' + formatoTiempo(p.tiempo_seg) + '</td><td class="n">' + p.pistas + '</td><td class="n">' + esc(fecha(p.fin)) + (p.pendiente ? '<span class="tag">sin subir</span>' : '') + '</td></tr>';
  }).join('');
  // ---- logros (se calculan con las partidas; no se guardan aparte)
  const hechas = ids.filter((i) => res[i]);
  const sinPistas = r.partidas.filter((p) => p.pistas === 0);
  const veloz = r.partidas.filter((p) => NOMBRES[p.juego] && p.tiempo_seg <= NOMBRES[p.juego].minutos * 30);
  const impecable = r.partidas.filter((p) => NOMBRES[p.juego] && p.pistas === 0 && p.tiempo_seg <= NOMBRES[p.juego].minutos * 45);
  const dificil = r.partidas.filter((p) => NOMBRES[p.juego] && NOMBRES[p.juego].dificultad >= 4);
  const LOGROS = [
    ['Primera aventura', 'Completa tu primera aventura.', r.partidas.length >= 1],
    ['Sin pistas', 'Termina una aventura sin pedir ninguna pista.', sinPistas.length >= 1],
    ['A todo gas', 'Termina una aventura en la mitad del tiempo previsto o menos.', veloz.length >= 1],
    ['Impecable', 'Sin pistas y en tres cuartos del tiempo o menos.', impecable.length >= 1],
    ['Valiente', 'Completa una aventura de dificultad difícil.', dificil.length >= 1],
    ['Viajera del tiempo', 'Completa 3 aventuras distintas.', hechas.length >= 3],
    ['Coleccionista', 'Completa todas las aventuras (' + ids.length + ').', ids.length > 0 && hechas.length === ids.length],
    ['Repetidora', 'Repite una aventura para mejorar tu tiempo.', Object.values(res).some((x) => x.veces >= 2)]
  ];
  const logrosHTML = '<h2>Logros · ' + LOGROS.filter((l) => l[2]).length + ' de ' + LOGROS.length + '</h2><div class="logros">' +
    LOGROS.map((l) => '<div class="logro ' + (l[2] ? 'on' : '') + '"><b>' + (l[2] ? '★ ' : '☆ ') + esc(l[0]) + '</b><small>' + esc(l[1]) + '</small></div>').join('') + '</div>';
  cont.innerHTML = logrosHTML + '<h2>Por aventura</h2><div class="resumen">' + tarjetas + '</div>' +
    '<h2>Historial</h2><div class="tabla-scroll"><table><thead><tr><th>Aventura</th><th>Tiempo</th><th>Pistas</th><th>Fecha</th></tr></thead><tbody>' + filas + '</tbody></table></div>';
}
pintar();
alCambiarSesion(() => pintar());
window.addEventListener('storage', pintar);
</script>
</body>
</html>
