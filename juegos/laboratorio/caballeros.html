<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laboratorio — Caballeros y bribones</title><link rel="stylesheet" href="lab.css">
<style>
.pers{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--linea)}
.pers .dec{flex:1;font-size:.9rem}
.pers button{min-width:104px}
</style></head>
<body><div class="lab">
<a class="volver" href="index.html">← Laboratorio</a>
<h1>Caballeros y bribones</h1>
<p class="sub">Idea de la guía §7.2 · solución única comprobada por script</p>
<div class="regla">Los <b>caballeros</b> siempre dicen la verdad y los <b>bribones</b> siempre mienten. Cada personaje hace una declaración. Averigua quién es quién tocando el botón de cada uno.</div>
<div class="tabla" id="lista"></div>
<div class="fila-btn"><button class="btn primario" id="comprobar">Comprobar</button></div>
<div class="msg" id="msg" aria-live="polite"></div>
</div>
<script src="datos.js"></script>
<script>
(function () {
  const D = window.LAB.caballeros;
  const lista = document.getElementById('lista');
  const estado = D.nombres.map(() => 0); // 0 ?, 1 caballero, 2 bribón
  const textos = ['¿?', 'Caballero', 'Bribón'];
  D.frases.forEach((f, i) => {
    const d = document.createElement('div');
    d.className = 'pers';
    const dec = document.createElement('div');
    dec.className = 'dec';
    dec.textContent = f;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn';
    b.dataset.i = String(i);
    b.textContent = textos[0];
    b.addEventListener('click', () => { estado[i] = (estado[i] + 1) % 3; b.textContent = textos[estado[i]]; });
    d.append(dec, b);
    lista.appendChild(d);
  });
  const msg = document.getElementById('msg');
  document.getElementById('comprobar').addEventListener('click', () => {
    const ok = D.caballeros.every((esCab, i) => estado[i] === (esCab ? 1 : 2));
    if (ok) { msg.className = 'msg ok'; msg.textContent = '¡Correcto! Las declaraciones solo encajan así.'; }
    else { msg.className = 'msg bad'; msg.textContent = 'Alguna declaración se contradice. Prueba a suponer que uno miente y mira qué pasa.'; }
  });
})();
</script></body></html>
