<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imprimir cartas — Montecarlo, 1965: Operación Cristal</title>
<style>
  :root{--gris:#8a94a3;--verde:#2f9e58;--roja:#c0453d;--azul:#3b78c9;--morada:#7b4fd0}
  *{box-sizing:border-box}
  body{margin:0;background:#cfd6dd;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#111}
  .barra{position:sticky;top:0;z-index:5;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#16212c;color:#e8eef4}
  .barra button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:8px 16px;background:#ffd27a;color:#2a1600;cursor:pointer}
  .barra label{font-size:.9rem;display:flex;gap:6px;align-items:center}
  .barra span.n{color:#93a4b5;font-size:.85rem}
  .hoja{width:210mm;min-height:297mm;margin:12px auto;padding:8mm 8mm;background:#fff;display:grid;grid-template-columns:repeat(3,63mm);grid-auto-rows:88mm;gap:2mm;justify-content:center;align-content:start;box-shadow:0 4px 18px rgba(0,0,0,.25);break-after:page}
  .guias .carta,.guias .dorso{outline:.2mm dashed #888;outline-offset:.6mm}

  .carta,.dorso{position:relative;width:63mm;height:88mm;border-radius:3mm;overflow:hidden;background:#1b2733;border:1.6mm solid var(--c,var(--gris));color:#fff;break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .arte{position:absolute;inset:0;background:linear-gradient(160deg,#2a3b4c,#101a24) center/cover no-repeat}
  .num{position:absolute;top:1.4mm;left:1.4mm;width:9.5mm;height:9.5mm;border-radius:50%;background:var(--c,var(--gris));border:.5mm solid #fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12pt;box-shadow:0 .4mm 1mm rgba(0,0,0,.5)}
  .etq{position:absolute;top:2mm;right:2mm;background:var(--c,var(--gris));font-size:5.5pt;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:.7mm 1.8mm;border-radius:1mm}
  .tit{position:absolute;left:0;right:0;bottom:0;padding:3mm 2.5mm 1.5mm;background:linear-gradient(transparent,rgba(5,10,16,.9) 40%);font-weight:700;font-size:7.5pt;text-align:center;line-height:1.15}
  .texto{position:absolute;left:3mm;right:3mm;top:12mm;bottom:12mm;background:rgba(244,234,208,.95);color:#2a2012;border-radius:1.5mm;padding:2mm 2.2mm;font-size:6.2pt;line-height:1.3;overflow:hidden;font-family:Georgia,"Times New Roman",serif}
  .texto.emoji{font-size:4.4mm;line-height:1.35;letter-spacing:.12em}
  .texto.chico{top:auto;bottom:11.5mm;font-size:7pt;text-align:center}
  .texto.largo{top:auto;bottom:11.5mm;left:2.5mm;right:2.5mm;padding:1.4mm 1.8mm;font-size:5.3pt;line-height:1.22;background:rgba(244,234,208,.93)}
  .texto.largo div{white-space:nowrap}
  .texto.largo div:nth-last-child(-n+2){white-space:normal}
  .texto.largo div:nth-last-child(2){margin-top:1.2mm;padding-top:1mm;border-top:.2mm solid rgba(42,32,18,.35)}
  .texto div+div{margin-top:.8mm}

  .texto.espejo{transform:scaleX(-1)}
  .acc{position:absolute;left:1.8mm;right:1.8mm;bottom:8mm;display:flex;flex-direction:row;flex-wrap:wrap;justify-content:center;gap:.6mm}
  .carta.conacc .texto.chico,.carta.conacc .texto.largo{bottom:17mm}
  .acc .g{display:flex;flex-wrap:wrap;align-items:center;gap:.6mm;background:rgba(5,10,16,.74);border-radius:1.2mm;padding:.5mm 1mm;font-size:2mm;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
  .acc .g b{margin-right:.6mm}
  .acc .g i{font-style:normal;min-width:4.4mm;height:3.8mm;padding:0 .9mm;border-radius:1.9mm;background:#fff;color:#111;display:inline-flex;align-items:center;justify-content:center;font-size:2.6mm;letter-spacing:0}
  .acc .coge b{color:#7be495}.acc .des b{color:#ff8f8f}.acc .comb b{color:#ffd27a}

  .dorso{--c:#ffd27a;background:radial-gradient(circle at 50% 38%,#ffe9a8 0,#ffd27a 6%,#1c3a4d 7%,#0a1218 70%)}
  .dorso::before{content:"";position:absolute;left:50%;top:38%;width:130%;height:14mm;transform:translate(0,-50%) rotate(-12deg);transform-origin:0 50%;background:linear-gradient(90deg,rgba(255,226,150,.55),transparent)}
  .dorso .t{position:absolute;left:0;right:0;bottom:9mm;text-align:center;font-weight:800;letter-spacing:.25em;font-size:10pt;color:#ffd27a}
  .dorso .s{position:absolute;left:0;right:0;bottom:4.5mm;text-align:center;font-size:6pt;letter-spacing:.2em;color:#9fb4c8}

  /* cartas-mosaico: sin borde, para que al juntarlas el dibujo continúe; número en la esquina exterior */
  .carta.mosaico{border:0}
  .carta.mosaico .num{top:1.4mm;left:1.4mm}
  .carta.mosaico.mz-r .num{left:auto;right:1.4mm}
  .carta.mosaico.mz-b .num{top:auto;bottom:1.4mm}
  .carta.mosaico.mz-m .num{left:calc(50% - 4.75mm)}

  /* reversos de las cartas con dos caras (hoja para imprimir a doble cara, con las columnas invertidas para que cada reverso quede detrás de su carta) */
  .rev{position:relative;width:63mm;height:88mm;border-radius:3mm;overflow:hidden;background:#1b2733;border:1.6mm solid #8a94a3;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rev .arte-rev{position:absolute;inset:0;background:center / cover no-repeat}
  .rev .nr{position:absolute;top:1.4mm;right:1.4mm;width:9.5mm;height:9.5mm;border-radius:50%;background:#8a94a3;border:.5mm solid #fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:9pt;color:#fff}
  .guias .rev{outline:.2mm dashed #888;outline-offset:.6mm}
  /* reversos ambientados (uno por carta, con su número); van en una hoja detrás de cada hoja de cartas, con las columnas invertidas */
  .guias .dorsoN{outline:.2mm dashed #888;outline-offset:.6mm}
  .dorsoN{position:relative;width:63mm;height:88mm;border-radius:3mm;overflow:hidden;border:1.6mm solid var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .dorsoN::after{content:"";position:absolute;inset:2.4mm;border:.4mm solid var(--ac);border-radius:1.6mm;opacity:.75}
  .dorsoN .dn-emoji{position:absolute;font-size:44mm;line-height:1;opacity:.17}
  .dorsoN .dn-num{position:relative;min-width:30mm;height:30mm;padding:0 4mm;border-radius:15mm;background:rgba(0,0,0,.55);border:.8mm solid var(--ac);display:flex;align-items:center;justify-content:center;font:800 34pt/1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#fff}
  .dorsoN .dn-t{position:absolute;left:0;right:0;top:6mm;text-align:center;font:800 6.5pt system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:.16em;color:var(--ac2);text-transform:uppercase;padding:0 5mm}
  .dorsoN .dn-b{position:absolute;left:0;right:0;bottom:6mm;text-align:center;font:700 5.5pt system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:.22em;color:var(--ac2);opacity:.9}
  @page{size:A4;margin:0}
  @media print{
    body{background:#fff}
    .barra{display:none}
    .hoja{margin:0;box-shadow:none}
  }
</style>
</head>
<body>
<div class="barra">
  <button type="button" onclick="window.print()">Imprimir</button>
  <label><input type="checkbox" id="guias" checked> Guías de corte</label>
  <span class="n" id="resumen"></span>
  <span class="n">Consejo: imprime en A4 al 100 % (sin «ajustar a página») y a DOBLE CARA, volteando por el lado largo: cada hoja de cartas va seguida de su hoja de reversos, con el número de cada carta, ya colocada para que cuadre.</span>
</div>
<div id="hojas"></div>

<script src="cartas-data.js"></script>
<script>var CLAVE_JUEGO = 'espia';</script>
<script>
fetchCartas().then(function(r){ return r.json(); }).then(function(datos){
window.JUEGO = datos;
(function(){
  var J = window.JUEGO;
  var COLORES = {gris:'#8a94a3',verde:'#2f9e58',roja:'#c0453d',azul:'#3b78c9',morada:'#7b4fd0'};
  var ETIQ = {gris:'',verde:'App',roja:'Combina',azul:'Combina',morada:'Herramienta'};
  var ids = Object.keys(J).filter(function(k){ return k.charAt(0) !== '_'; }).sort(function(a, b){
    if (a === 'P') return -1; if (b === 'P') return 1; return Number(a) - Number(b);
  });

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function cartaHTML(id){
    var c = J[id], color = COLORES[c.tipo] || COLORES.gris;
    if (c.mosaico) {
      var mz = c.mosaico;
      return '<div class="carta mosaico' + (mz.filas > 1 && mz.fila >= mz.filas - 1 ? ' mz-b' : '') + (mz.cols > 1 && mz.col >= mz.cols - 1 ? ' mz-r' : (mz.cols > 2 && mz.col > 0 ? ' mz-m' : '')) + '" style="--c:#8a94a3"><div class="arte" data-id="' + esc(id) + '"></div>' +
        '<div class="num">' + esc(id) + '</div></div>';
    }
    var titulo = c.titulo.replace(/^Carta\s+\S+\s+—\s+/, '');
    var conacc = !!((c.coge && c.coge.length) || (c.descarta && c.descarta.length) || c.combina);
    var html = '<div class="carta' + (conacc ? ' conacc' : '') + '" style="--c:' + color + '"><div class="arte" data-id="' + esc(id) + '"></div>' +
      '<div class="num">' + esc(id) + '</div>';
    if (ETIQ[c.tipo]) html += '<div class="etq">' + ETIQ[c.tipo] + '</div>';
    if (c.textoCarta && c.textoCarta.length) {
      var clase = (c.textoCarta.length <= 3 ? ' chico' : ' largo') + (/\p{Extended_Pictographic}/u.test(c.textoCarta.join('')) ? ' emoji' : '') + (c.textoEspejo ? ' espejo' : '');
      html += '<div class="texto' + clase + '">' + c.textoCarta.map(function(l){ return '<div>' + esc(l) + '</div>'; }).join('') + '</div>';
    }
    function chips(n){ return n.map(function(x){ return '<i>' + esc(x) + '</i>'; }).join(''); }
    var acc = '';
    if (c.coge && c.coge.length) acc += '<div class="g coge"><b>Coge</b>' + chips(c.coge) + '</div>';
    if (c.descarta && c.descarta.length) acc += '<div class="g des"><b>Descarta</b>' + chips(c.descarta) + '</div>';
    if (c.combina) acc += '<div class="g comb"><b>Combinable:</b> ' + (String(c.combina[0]).charAt(0) === '+' ? 'suma el modificador de la app' : 'suma los números') + '</div>';
    if (acc) html += '<div class="acc">' + acc + '</div>';
    return html + '<div class="tit">' + esc(titulo) + '</div></div>';
  }

  /*DORSOS*/ var DORSOS = {"faro": {"titulo": "El Faro de Cabo Niebla", "emoji": "🌊", "c": ["#0e3a52", "#04101a"], "ac": "#c9a45a", "ac2": "#f0d9a0", "patron": "repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 6mm,transparent 6mm 12mm)"}, "egipto": {"titulo": "Egipto, 1274 a.C.", "emoji": "🏺", "c": ["#4a3512", "#150f05"], "ac": "#e0b04a", "ac2": "#f2d27a", "patron": "repeating-linear-gradient(45deg,rgba(0,0,0,.2) 0 3mm,transparent 3mm 6mm),repeating-linear-gradient(-45deg,rgba(255,255,255,.08) 0 3mm,transparent 3mm 6mm)"}, "marte": {"titulo": "Marte, 2157", "emoji": "🚀", "c": ["#5a2a14", "#12060a"], "ac": "#ff8a50", "ac2": "#ffb085", "patron": "radial-gradient(circle,rgba(255,255,255,.12) .6mm,transparent .7mm) 0 0/4mm 4mm"}, "florencia": {"titulo": "Florencia, 1503", "emoji": "🪞", "c": ["#5a3a1a", "#140c06"], "ac": "#d9a441", "ac2": "#f0c773", "patron": "repeating-linear-gradient(60deg,rgba(255,220,140,.14) 0 .5mm,transparent .5mm 5mm),repeating-linear-gradient(-60deg,rgba(255,220,140,.14) 0 .5mm,transparent .5mm 5mm)"}, "dinosaurios": {"titulo": "Cretácico", "emoji": "🦖", "c": ["#2f5a22", "#07120a"], "ac": "#b5e35b", "ac2": "#d9f59a", "patron": "radial-gradient(circle at 50% 100%,rgba(255,255,255,.12) 0 2.2mm,transparent 2.3mm) 0 0/5mm 4mm"}, "cuento": {"titulo": "Érase una vez", "emoji": "📖", "c": ["#4a2a8a", "#120a2a"], "ac": "#f6c453", "ac2": "#ffe08a", "patron": "radial-gradient(circle,rgba(255,240,170,.4) .5mm,transparent .6mm) 0 0/7mm 7mm"}, "trono": {"titulo": "Hielo y Fuego", "emoji": "🐉", "c": ["#2c3a4a", "#0a0f16"], "ac": "#8fc7ee", "ac2": "#cfe8fb", "patron": "repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 .4mm,transparent .4mm 4mm),repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 .4mm,transparent .4mm 4mm)"}, "pompeya": {"titulo": "Pompeya, 79 d.C.", "emoji": "🌋", "c": ["#6a3418", "#150a06"], "ac": "#e08a4a", "ac2": "#f5c08a", "patron": "conic-gradient(rgba(0,0,0,.2) 25%,transparent 0 50%,rgba(0,0,0,.2) 0 75%,transparent 0) 0 0/6mm 6mm"}, "arcade": {"titulo": "Game Over, 1985", "emoji": "🕹️", "c": ["#4a1a7a", "#07040f"], "ac": "#ff5ad8", "ac2": "#8ffcff", "patron": "repeating-linear-gradient(0deg,rgba(255,80,220,.28) 0 .3mm,transparent .3mm 5mm),repeating-linear-gradient(90deg,rgba(80,230,255,.28) 0 .3mm,transparent .3mm 5mm)"}, "oeste": {"titulo": "Dry Gulch, 1878", "emoji": "🤠", "c": ["#7a4a1e", "#160d06"], "ac": "#e0a040", "ac2": "#f5d48a", "patron": "repeating-linear-gradient(90deg,rgba(0,0,0,.24) 0 .4mm,transparent .4mm 8mm)"}, "espia": {"titulo": "Montecarlo, 1965", "emoji": "🕵️", "c": ["#0e5a6a", "#07121a"], "ac": "#ff6fa8", "ac2": "#7fe8f0", "patron": "radial-gradient(circle,rgba(255,255,255,.16) .7mm,transparent .8mm) 0 0/3mm 3mm"}, "futbol": {"titulo": "La Final del Siglo", "emoji": "⚽", "c": ["#1f6a30", "#06140a"], "ac": "#f2c230", "ac2": "#a8ec96", "patron": "repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 8mm,transparent 8mm 16mm)"}, "piratas": {"titulo": "Mar de las Brumas, 1715", "emoji": "🏴‍☠️", "c": ["#1c5a6a", "#06141a"], "ac": "#e8b84a", "ac2": "#9fe0e0", "patron": "repeating-linear-gradient(0deg,rgba(255,255,255,.1) 0 .4mm,transparent .4mm 3mm),repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 .3mm,transparent .3mm 9mm)"}, "juguetes": {"titulo": "El Cuarto de Leo, 1995", "emoji": "🧸", "c": ["#3a6ad0", "#121e48"], "ac": "#ffcc33", "ac2": "#ff9ec0", "patron": "radial-gradient(circle,rgba(255,204,51,.45) 1mm,transparent 1.1mm) 0 0/8mm 8mm,radial-gradient(circle,rgba(255,158,192,.4) .8mm,transparent .9mm) 4mm 4mm/8mm 8mm"}}; /*FIN-DORSOS*/
  var D = DORSOS[CLAVE_JUEGO] || DORSOS.faro;
  var hayReversos = ids.some(function(k){ return J[k].reverso; });
  function dorsoCarta(k){
    return '<div class="dorsoN" style="--ac:' + D.ac + ';--ac2:' + D.ac2 + ';background:' + D.patron + ',radial-gradient(circle at 50% 42%,' + D.c[0] + ',' + D.c[1] + ' 78%)">' +
      '<div class="dn-t">' + esc(D.titulo) + '</div><div class="dn-emoji">' + D.emoji + '</div><div class="dn-num">' + esc(k) + '</div><div class="dn-b">UNLOCK C&amp;A</div></div>';
  }
  function hojaReverso(grupo){
    var celdas = [];
    for (var f = 0; f < 3; f++) for (var c = 2; c >= 0; c--) {
      var k = grupo[f * 3 + c];
      if (!k) celdas.push('<div></div>');
      else if (J[k].reverso) celdas.push('<div class="rev"><div class="arte-rev" data-rev="' + esc(k) + '"></div><div class="nr">R' + esc(k) + '</div></div>');
      else celdas.push(dorsoCarta(k));
    }
    return '<div class="hoja guias hoja-reverso">' + celdas.join('') + '</div>';
  }
  var tarjetas = ids.map(cartaHTML);
  var hojas = [];
  for (var i = 0; i < tarjetas.length; i += 9) hojas.push(tarjetas.slice(i, i + 9));

  document.getElementById('hojas').innerHTML =
    hojas.map(function(h, n){ return '<div class="hoja guias">' + h.join('') + '</div>' + hojaReverso(ids.slice(n * 9, n * 9 + 9)); }).join('');

  document.querySelectorAll('.arte-rev').forEach(function(el){ el.style.backgroundImage = 'url("img/' + el.dataset.rev + 'r.jpg")'; });
  document.getElementById('guias').addEventListener('change', function(e){
    document.querySelectorAll('.hoja').forEach(function(h){ h.classList.toggle('guias', e.target.checked); });
  });

  var faltan = [];
  document.querySelectorAll('.arte').forEach(function(el){
    var id = el.dataset.id, exts = ['jpg'], i = 0;
    (function probar(){
      var img = new Image();
      img.onload = function(){ el.style.backgroundImage = 'url("img/' + id + '.' + exts[i] + '")'; contar(); };
      img.onerror = function(){ i++; if (i < exts.length) probar(); else { faltan.push(id); contar(); } };
      img.src = 'img/' + id + '.' + exts[i];
    })();
  });
  var vistas = 0;
  function contar(){
    vistas++;
    if (vistas === ids.length) {
      fetch('img/pendientes.json?v=' + Date.now(), {cache: 'no-store'}).then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; }).then(function(pend){
        var r = document.getElementById('resumen');
        if (faltan.length) r.textContent = 'Faltan ilustraciones: ' + faltan.join(', ');
        else if (pend.length) r.textContent = 'Ilustraciones de relleno (aún sin hacer): ' + pend.join(', ');
        else r.textContent = 'Todas las ilustraciones están listas.';
      });
    }
  }
})();
}).catch(function(){ document.body.insertAdjacentHTML('beforeend', '<p style="padding:20px">No se pudo cargar las cartas. Ejecuta python herramientas/sincronizar_cartas.py o abre la página desde el sitio web.</p>'); });
</script>
</body>
</html>
